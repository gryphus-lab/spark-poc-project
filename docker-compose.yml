version: '3.8'
services:
  spark-master:
    image: apache/spark:latest
    container_name: spark-master
    ports:
      - "8080:8080" # Master Web UI
      - "7077:7077" # Cluster communication
    # Use standard Spark start command
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0

  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker
    depends_on:
      - spark-master
    # Point worker to the master's container name
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  spark-submit:
    build: .
    container_name: spark-submit
    volumes:
      - .:/opt/spark/project
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 admin password;
      /usr/bin/mc mb myminio/warehouse || true;
      exit 0;
      "

  catalog:
    image: tabulario/iceberg-rest
    ports: ["8181:8181"]
    environment:
      - CATALOG_WAREHOUSE=s3a://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
    depends_on: [minio]