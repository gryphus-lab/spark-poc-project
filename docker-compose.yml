services:
  spark-master:
    image: apache/spark:4.1.1
    container_name: spark-master
    ports:
      - "8080:8080" # Master Web UI
      - "7077:7077" # Cluster communication
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0

  spark-worker:
    image: apache/spark:4.1.1
    container_name: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  spark-submit:
    build: .
    container_name: spark-submit
    volumes:
      - .:/opt/spark/project
      - spark-warehouse:/opt/spark/warehouse
    depends_on:
      - spark-master
      - minio
      - minio-setup
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - S3A_ACCESS_KEY=${S3A_ACCESS_KEY}
      - S3A_SECRET_KEY=${S3A_SECRET_KEY}
      - S3_ENDPOINT=http://minio:9000

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/warehouse || true;
      exit 0;
      "

volumes:
  minio-data:
  spark-warehouse:
