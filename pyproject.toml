[project]
name = "spark-poc-project"
version = "0.1.0"
description = "A professional Apache Spark Proof of Concept"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
dependencies = [
    "pyspark>=3.5.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
